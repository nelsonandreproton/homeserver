services:

  # ── CNCSearch web UI ────────────────────────────────────────────────────────
  cncsearch:
    build:
      context: ../CNCSearch
      dockerfile: Dockerfile
    container_name: cncsearch
    restart: unless-stopped
    env_file: ../CNCSearch/.env
    volumes:
      - cncsearch_data:/data
    expose:
      - "8080"

  # ── HTTPS reverse proxy (Caddy) ─────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: cncsearch_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Set to: YOUR-IP-WITH-DASHES.sslip.io  (e.g. 1-2-3-4.sslip.io)
      CADDY_HOST: ${CADDY_HOST}
    volumes:
      - ../CNCSearch/Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/garminbot/SpotifyTranscript:/srv/aibrief:ro  # SpotifyTranscript mindmap.html → /aibrief/
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cncsearch

  # ── GarminBot ────────────────────────────────────────────────────────────────
  # Unprivileged: default bridge network, no host PID/network, no docker.sock, no
  # host filesystem. /server_status and /container_disk read snapshots that
  # hetzner-monitor (the only privileged collector) writes to the hetzner_status volume.
  garminbot:
    build:
      context: ../GarminBot
      dockerfile: Dockerfile
    container_name: garminbot
    restart: unless-stopped
    env_file: ../GarminBot/.env
    environment:
      PYTHONPATH: /cncsearch:/hetznercheck
      CNCSEARCH_DATABASE_PATH: /cncsearch_data/cncsearch.db
      CNCSEARCH_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-jina}
      CNCSEARCH_JINA_API_KEY: ${JINA_API_KEY}
      HETZNERCHECK_CONFIG_PATH: /hetznercheck/config.yml
      HETZNERCHECK_STATUS_DIR: /hetznerstatus       # snapshots written by hetzner-monitor
      HEALTH_PORT: "8080"                           # container-internal only (expose, not published)
      PTEVENTS_BASE_URL: "http://ptevents:8080"     # compose network
      GARMIN_API_HOST: "0.0.0.0"                    # bind inside the container; published to host loopback below
      HEARTBEAT_DB: /app/heartbeats/heartbeats.db  # shared liveness DB
    volumes:
      - ../GarminBot/data:/app/data
      - cncsearch_data:/cncsearch_data              # shared DB with cncsearch
      - ../CNCSearch:/cncsearch:ro                  # /canticos handler source
      - ../HetznerCheck:/hetznercheck:ro            # /server_status handler source
      - hetzner_status:/hetznerstatus:ro            # metrics snapshots (read-only)
      - /home/garminbot/Obsidian:/obsidian             # Obsidian vault for /xread notes
      - heartbeats_data:/app/heartbeats             # shared liveness DB (read/write)
    expose:
      - "8080"
    ports:
      # Internal data API (only started if GARMIN_API_PORT=8765 is set in the service env file).
      # Host-loopback-only: NOT reachable from the internet.
      - "127.0.0.1:8765:8765"

  # ── JMJ2027 Bot ──────────────────────────────────────────────────────────────
  jmj2027:
    build:
      context: ../JMJ2027
      dockerfile: Dockerfile
    container_name: jmj2027
    restart: unless-stopped
    env_file: ../JMJ2027/.env
    environment:
      - TZ=Europe/Lisbon
      - PYTHONPATH=/hetznercheck
      - HEARTBEAT_DB=/app/heartbeats/heartbeats.db
    volumes:
      - jmj2027_data:/app/data
      - ../HetznerCheck:/hetznercheck:ro            # heartbeat module
      - heartbeats_data:/app/heartbeats             # shared liveness DB (read/write)

  # ── Liturgia das Horas Bot ───────────────────────────────────────────────────
  liturgia-bot:
    build:
      context: ../liturgia-das-horas
      dockerfile: Dockerfile
    container_name: liturgia-bot
    restart: unless-stopped
    env_file: ../liturgia-das-horas/liturgia_bot.env
    environment:
      - TZ=Europe/Lisbon
      - PYTHONPATH=/hetznercheck
      - HEARTBEAT_DB=/app/heartbeats/heartbeats.db
    volumes:
      - liturgia_data:/app/data
      - ../HetznerCheck:/hetznercheck:ro            # heartbeat module
      - heartbeats_data:/app/heartbeats             # shared liveness DB (read/write)

  # ── PTSquawk — Portuguese airspace emergency monitor ─────────────────────────
  ptsquawk:
    build:
      context: ../PTSquawk/bot
      dockerfile: Dockerfile
    container_name: ptsquawk
    restart: unless-stopped
    env_file: ../PTSquawk/.env
    environment:
      - TZ=Europe/Lisbon
      - PYTHONPATH=/hetznercheck
      - HEARTBEAT_DB=/app/heartbeats/heartbeats.db
    volumes:
      - ptsquawk_data:/data
      - ../HetznerCheck:/hetznercheck:ro            # heartbeat module
      - heartbeats_data:/app/heartbeats             # shared liveness DB (read/write)
    expose:
      - "5000"

  # ── PTEvents — local disruption alerts ──────────────────────────────────────
  # DISABLED 2026-11-09: turned off on request (noisy, transit providers blocked).
  # Data volume kept. To re-enable: remove the `profiles:` line below, add
  # ptevents back to deploy.sh's health loop, push, run deploy.sh.
  ptevents:
    profiles: ["disabled"]
    build:
      context: ../PTEvents
      dockerfile: Dockerfile
    container_name: ptevents
    restart: unless-stopped
    env_file: ../PTEvents/.env
    environment:
      - TZ=Europe/Lisbon
      - PYTHONPATH=/hetznercheck
      - HEARTBEAT_DB=/app/heartbeats/heartbeats.db
    volumes:
      - ptevents_data:/app/data
      - ../PTEvents/config:/app/config:ro
      - ../HetznerCheck:/hetznercheck:ro            # heartbeat module
      - heartbeats_data:/app/heartbeats             # shared liveness DB (read/write)
    expose:
      - "8080"                 # reached by garminbot at http://ptevents:8080 (compose network)

  # ── HetznerCheck monitor ─────────────────────────────────────────────────────
  hetzner-monitor:
    build:
      context: ../HetznerCheck
      dockerfile: Dockerfile
    container_name: hetzner-monitor
    restart: unless-stopped
    pid: "host"
    network_mode: "host"
    # Runs as root on purpose: /container_disk walks /var/lib/docker/overlay2 (root-only),
    # and docker.sock access is root-equivalent anyway, so a non-root uid adds no real
    # isolation. Hardening is via dropped capabilities instead.
    user: "0:0"
    group_add:
      - "${DOCKER_GID:-999}"  # docker group GID for socket access
      - "4"                   # adm: read /var/log/auth.log
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH       # read container overlay dirs owned by other uids (disk stats)
    security_opt:
      - no-new-privileges:true
    env_file: ../HetznerCheck/.env
    environment:
      - TZ=Europe/Lisbon
      - STATUS_DIR=/app/status                      # writes metrics.json / container_disk.json
      - HEARTBEAT_DB=/app/heartbeats/heartbeats.db  # shared liveness DB
    volumes:
      - /:/rootfs:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../HetznerCheck/config.yml:/app/config.yml:ro
      - heartbeats_data:/app/heartbeats:ro          # shared liveness DB (read-only)
      - hetzner_status:/app/status                  # snapshots for garminbot (read/write)


  # ── GitLab MCP gateway — exposes @zereight/mcp-gitlab over HTTP for Notion ───
  # upstream: internal only; per-request GitLab PAT injected by the gateway.
  # DISABLED 2026-11-07: unused since 2026-06-08 and it forwards to the company
  # GitLab. To re-enable: remove both `profiles:` lines below, push, run deploy.sh.
  gitlab-mcp-upstream:
    profiles: ["disabled"]
    build:
      context: ../GitlabMCPServer
      dockerfile: Dockerfile.upstream
    container_name: gitlab-mcp-upstream
    restart: unless-stopped
    environment:
      GITLAB_API_URL: "https://np-gitlab.swedencentral.cloudapp.azure.com/api/v4"
      GITLAB_PERSONAL_ACCESS_TOKEN: "placeholder"  # required at startup; overridden per-request
      STREAMABLE_HTTP: "true"
      REMOTE_AUTHORIZATION: "true"
      HOST: "0.0.0.0"
      PORT: "3002"
    expose:
      - "3002"

  # gateway: Caddy reverse-proxies here; reads ?token= and forwards as Bearer.
  gitlab-mcp-gateway:
    profiles: ["disabled"]
    build:
      context: ../GitlabMCPServer
      dockerfile: Dockerfile
    container_name: gitlab-mcp-gateway
    restart: unless-stopped
    environment:
      PORT: "8808"
      UPSTREAM_HOST: "gitlab-mcp-upstream"
      UPSTREAM_PORT: "3002"
      STATS_FILE: "/data/usage-stats.json"
    expose:
      - "8808"
    volumes:
      - gitlab_mcp_data:/data
    depends_on:
      - gitlab-mcp-upstream


  # ── GarminBot MCP server — read-only analytics over HTTP for Claude ──────────
  # Separate bridge-network container (NOT host mode) so Caddy reaches it by name.
  # Same image as garminbot; runs the Streamable HTTP MCP server instead of the bot.
  # DB mounted read-only; bearer-token auth (GARMIN_MCP_TOKEN supplied via env_file).
  garminbot-mcp:
    build:
      context: ../GarminBot
      dockerfile: Dockerfile
    container_name: garminbot-mcp
    restart: unless-stopped
    command: ["python", "-m", "src.mcp.server"]
    env_file: ../GarminBot/.env
    environment:
      MCP_TRANSPORT: "http"
      MCP_PORT: "8000"
      DATABASE_PATH: /app/data/garmin_data.db
      # Host header Caddy forwards; must match the public subdomain or DNS-rebinding
      # protection rejects every request. Override via env if the IP changes.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-garmin-mcp.${CADDY_HOST}}
    volumes:
      - ../GarminBot/data:/app/data:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import glob,sys;sys.exit(0 if any(b'src.mcp.server' in open(p,'rb').read() for p in glob.glob('/proc/*/cmdline')) else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3


  # ── Nelfoot — online Elifoot clone (FastAPI + SQLite) ────────────────────────
  # Caddy proxies nelfoot.${CADDY_HOST}. Host-header check must allow the public
  # subdomain; localhost stays allowed for the container healthcheck.
  nelfoot:
    build:
      context: ../nelfoot
      dockerfile: Dockerfile
    container_name: nelfoot
    restart: unless-stopped
    env_file: ../nelfoot/.env
    environment:
      NELFOOT_ALLOWED_HOSTS: ${NELFOOT_ALLOWED_HOSTS:-nelfoot.${CADDY_HOST},localhost,127.0.0.1}
    volumes:
      - nelfoot_data:/data
    expose:
      - "8000"
    mem_limit: 512m

  # ── HouseTracker — property auctions in Lisboa/Setúbal ≤ 300k ───────────────
  housetracker:
    build:
      context: ../HouseTracker
      dockerfile: Dockerfile
    container_name: housetracker
    restart: unless-stopped
    env_file: ../HouseTracker/.env
    environment:
      - TZ=Europe/Lisbon
      - PYTHONPATH=/hetznercheck
      - HEARTBEAT_DB=/app/heartbeats/heartbeats.db
    volumes:
      - housetracker_data:/app/data
      - ../HetznerCheck:/hetznercheck:ro            # heartbeat module
      - heartbeats_data:/app/heartbeats             # shared liveness DB (read/write)
    expose:
      - "8080"
    mem_limit: 256m


volumes:
  cncsearch_data:
  caddy_data:
  caddy_config:
  jmj2027_data:
  liturgia_data:
  ptsquawk_data:
  ptevents_data:
  heartbeats_data:                                  # bot liveness heartbeats
  hetzner_status:                                   # hetzner-monitor snapshots -> garminbot
  gitlab_mcp_data:
  nelfoot_data:
  housetracker_data:
